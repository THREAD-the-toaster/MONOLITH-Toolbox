name: Windows build (unsigned)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure MSVC x64
        run: cmake -S . -B build -A x64

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Check product metadata and prepare portable package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-Item 'build/Release/MONOLITH_Toolbox.exe'
          if ($exe.VersionInfo.ProductName -ne 'MONOLITH Toolbox') {
            throw 'Unexpected executable product name'
          }
          if ($exe.VersionInfo.FileVersion -ne $exe.VersionInfo.ProductVersion) {
            throw 'File and product versions differ'
          }
          $package = 'dist/MONOLITH-Toolbox-windows-x64-unsigned'
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          Copy-Item -LiteralPath $exe.FullName -Destination $package
          Copy-Item -LiteralPath 'build/Release/assets' -Destination $package -Recurse
          foreach ($notice in @('LICENSE', 'README.md', 'PRIVACY.md', 'THIRD_PARTY_NOTICES.md')) {
            Copy-Item -LiteralPath $notice -Destination $package
          }
          New-Item -ItemType Directory -Path "$package/docs" -Force | Out-Null
          Copy-Item -LiteralPath 'docs/CODE_SIGNING.md', 'docs/SIGNPATH.md' -Destination "$package/docs"
          @(
            "Source repository: $env:GITHUB_REPOSITORY",
            "Source commit: $env:GITHUB_SHA",
            "Workflow run: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID",
            'Signing status: unsigned'
          ) | Set-Content "$package/BUILD-INFO.txt"
          Get-ChildItem $package -File -Recurse | ForEach-Object {
            $hash = Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256
            '{0}  {1}' -f $hash.Hash, [IO.Path]::GetRelativePath((Resolve-Path $package).Path, $_.FullName)
          } | Set-Content 'dist/SHA256SUMS.txt'

      - name: Upload unsigned portable build
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: MONOLITH-Toolbox-windows-x64-unsigned
          path: dist/
          if-no-files-found: error
          retention-days: 14
